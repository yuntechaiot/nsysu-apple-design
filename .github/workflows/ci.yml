name: NSYSU 檢查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ztsyxnrnemvcladbaaem.supabase.co
      SUPABASE_EXPECTED_REF: ztsyxnrnemvcladbaaem
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_CI_SYNTHETIC
      PUBLIC_APP_URL: https://research.example.org/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python -m pytest -q
      - run: python -m ruff check backend/nsysu streamlit_app.py
      - run: python -m mypy backend/nsysu --ignore-missing-imports --check-untyped-defs
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
